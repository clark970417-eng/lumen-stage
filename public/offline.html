<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11161c" />
    <title>Lumen Stage Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080b0f; color: #eef3ef; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at 50% 18%, #28352d 0, #11161c 34%, #080b0f 72%); }
      main { width: min(420px, 100%); }
      img { width: 52px; height: 52px; margin-bottom: 28px; }
      span { color: #9fb7a9; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: 32px; line-height: 1; letter-spacing: 0; }
      p { margin: 0; color: #c7d2cb; line-height: 1.6; }
      a { display: inline-flex; margin-top: 24px; color: #f1f7f1; font-weight: 700; text-decoration: none; border-bottom: 1px solid #f1f7f1; }
    </style>
  </head>
  <body>
    <main>
      <img src="./logo-mark.svg" alt="" />
      <span>Offline</span>
      <h1>Lumen Stage is saved on this device.</h1>
      <p>Reconnect once to load the latest studio files. Scenes already saved in this browser remain on this device.</p>
      <a href="./?route=studio">Try again</a>
    </main>
  </body>
</html>
